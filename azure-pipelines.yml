trigger:
  branches:
    include: [main, develop]

pool:
  vmImage: 'ubuntu-latest'

variables:
  testEnvironment: prod

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: Install Node.js

  - script: npm ci
    displayName: Install dependencies

  - script: npx playwright install --with-deps
    displayName: Install Playwright browsers

  - script: npx playwright test
    displayName: Run Playwright tests
    env:
      TEST_ENV: $(testEnvironment)
      # Azure DevOps does not set CI automatically (unlike GitHub Actions), and
      # playwright.config.ts only emits the JUnit reporter when CI is set. Without
      # this the PublishTestResults task below finds no results file.
      CI: 'true'

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: '**/junit-results.xml'
      testRunTitle: Playwright Tests

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      pathToPublish: playwright-report
      artifactName: playwright-html-report
